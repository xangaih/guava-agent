<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Concierge — Trip Board</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0f14;
    --panel: #12181f;
    --border: #232c36;
    --text: #e6edf3;
    --muted: #8b98a5;
    --accent: #3fb950;
    --proposed: #d29922;
    --confirmed: #3fb950;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 24px;
  }
  h1 { font-size: 20px; margin: 0 0 4px 0; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .budget-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 24px;
  }
  .budget-numbers { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
  .budget-numbers .remaining { color: var(--muted); }
  .budget-bar-track {
    height: 10px;
    background: #0e1319;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .budget-bar-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.4s ease;
  }
  .budget-bar-fill.over { background: #f85149; }
  .day-group { margin-bottom: 28px; }
  .day-header {
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
  }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .card img { width: 100%; height: 120px; object-fit: cover; display: block; }
  .card-body { padding: 10px 12px; }
  .card-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .card-meta { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .badge {
    display: inline-block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .badge.proposed { background: rgba(210,153,34,0.15); color: var(--proposed); }
  .badge.confirmed { background: rgba(63,185,80,0.15); color: var(--confirmed); }
  .empty { color: var(--muted); font-style: italic; padding: 40px; text-align: center; }
  .comic-panel {
    margin-top: 24px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    text-align: center;
  }
  .comic-panel img { max-width: 100%; border-radius: 8px; }
  .comic-fallback { font-size: 28px; }
  .status-line { display: flex; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 8px; }
  .status-dot.live { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .transcript-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 24px;
    max-height: 220px;
    overflow-y: auto;
    font-size: 13px;
    line-height: 1.5;
  }
  .transcript-panel .line { margin-bottom: 6px; }
  .transcript-panel .speaker-agent { color: var(--accent); font-weight: 600; }
  .transcript-panel .speaker-caller { color: #58a6ff; font-weight: 600; }
  .transcript-panel .empty { padding: 8px; text-align: left; }
</style>
</head>
<body>
  <h1>Concierge — Trip Board</h1>
  <div class="subtitle">Nomi Travel Concierge · local demo dashboard</div>

  <div class="status-line">
    <span id="status-dot" class="status-dot"></span>
    <span id="status-text">No active call</span>
  </div>

  <div class="budget-panel">
    <div class="budget-numbers">
      <span id="budget-label">No trip yet</span>
      <span id="budget-remaining" class="remaining"></span>
    </div>
    <div class="budget-bar-track"><div id="budget-fill" class="budget-bar-fill" style="width:0%"></div></div>
  </div>

  <div id="transcript-panel" class="transcript-panel"></div>

  <div id="itinerary"></div>
  <div id="comic-panel"></div>

<script>
async function poll() {
  try {
    const [tripRes, itemsRes, comicRes, statusRes, transcriptRes] = await Promise.all([
      fetch('/api/trip'),
      fetch('/api/itinerary'),
      fetch('/api/comic'),
      fetch('/api/status'),
      fetch('/api/transcript'),
    ]);
    const trip = await tripRes.json();
    const items = await itemsRes.json();
    const comic = await comicRes.json();
    const status = await statusRes.json();
    const transcript = await transcriptRes.json();
    renderBudget(trip, items);
    renderItinerary(items);
    renderComic(comic);
    renderStatus(status);
    renderTranscript(transcript);
  } catch (e) {
    // keep polling even on a transient failure
  }
}

function renderStatus(status) {
  const dot = document.getElementById('status-dot');
  const text = document.getElementById('status-text');
  if (status.active_call) {
    dot.classList.add('live');
    text.textContent = 'Call in progress';
  } else {
    dot.classList.remove('live');
    text.textContent = 'No active call';
  }
}

function renderTranscript(lines) {
  const el = document.getElementById('transcript-panel');
  if (!lines.length) {
    el.innerHTML = '<div class="empty">No transcript yet</div>';
    return;
  }
  el.innerHTML = lines.map(l => `<div class="line">
    <span class="speaker-${l.speaker === 'agent' ? 'agent' : 'caller'}">${l.speaker === 'agent' ? 'Nomi' : 'Caller'}:</span>
    ${escapeHtml(l.utterance)}
  </div>`).join('');
  el.scrollTop = el.scrollHeight;
}

function renderBudget(trip, items) {
  const label = document.getElementById('budget-label');
  const remaining = document.getElementById('budget-remaining');
  const fill = document.getElementById('budget-fill');
  if (!trip) {
    label.textContent = 'No trip yet';
    remaining.textContent = '';
    fill.style.width = '0%';
    return;
  }
  const spent = items.filter(i => i.status === 'confirmed').reduce((sum, i) => sum + (i.cost || 0), 0);
  const total = trip.total_budget || 0;
  const remain = total - spent;
  label.textContent = `${trip.destination || 'Trip'} · $${spent.toFixed(0)} / $${total.toFixed(0)}`;
  remaining.textContent = `$${remain.toFixed(0)} remaining`;
  const pct = total > 0 ? Math.min((spent / total) * 100, 100) : 0;
  fill.style.width = pct + '%';
  fill.classList.toggle('over', spent > total);
}

function renderItinerary(items) {
  const el = document.getElementById('itinerary');
  const dashboardable = items.filter(i => ['hotel', 'restaurant', 'experience'].includes(i.item_type));
  if (!dashboardable.length) {
    el.innerHTML = '<div class="empty">No proposals yet — call in to start planning</div>';
    return;
  }
  const groups = {};
  for (const item of dashboardable) {
    const key = item.day_date || 'Unscheduled';
    (groups[key] = groups[key] || []).push(item);
  }
  el.innerHTML = Object.entries(groups).map(([day, dayItems]) => `
    <div class="day-group">
      <div class="day-header">${escapeHtml(day)}</div>
      <div class="cards">${dayItems.map(cardHtml).join('')}</div>
    </div>
  `).join('');
}

function cardHtml(item) {
  const seed = item.title.toLowerCase().replace(/[^a-z0-9]+/g, '-');
  return `<div class="card">
    <img src="https://picsum.photos/seed/${encodeURIComponent(seed)}/400/240" alt="" />
    <div class="card-body">
      <div class="card-name">${escapeHtml(item.title)}</div>
      <div class="card-meta">${escapeHtml(item.location || '')} · $${(item.cost || 0).toFixed(0)}</div>
      <span class="badge ${item.status}">${escapeHtml(item.status)}</span>
    </div>
  </div>`;
}

function renderComic(comic) {
  const el = document.getElementById('comic-panel');
  if (!comic) {
    el.innerHTML = '';
    return;
  }
  if (comic.fallback) {
    el.innerHTML = '<div class="comic-panel"><div class="comic-fallback">🎉 Your trip is booked!</div></div>';
  } else {
    el.innerHTML = `<div class="comic-panel"><img src="${escapeHtml(comic.image_url)}" alt="Trip comic" /></div>`;
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[m]));
}

poll();
setInterval(poll, 1500);
</script>
</body>
</html>
